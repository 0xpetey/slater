name: Slater
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "26.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode manages signing with the personal team's Apple Development certificate.
    # Switch to the paid team (RQB2E9KNQB) and Developer ID when sharing with coworkers.
    DEVELOPMENT_TEAM: QCXUWE7EEH
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 1.10.0
targets:
  Slater:
    type: application
    platform: macOS
    sources: [Slater]
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      testTargets: [SlaterTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.slater
        # So tests and benchmarks can run against Release (optimized) builds too.
        ENABLE_TESTABILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Slater/App/Info.plist
      properties:
        CFBundleDisplayName: Slater
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
  SlaterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SlaterTests]
    dependencies:
      - target: Slater
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.slater.tests
